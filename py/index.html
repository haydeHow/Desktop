<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>daily dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #1e1e1e;
  --panel: #252525;
  --border: #3a3a3a;
  --fg: #e6e6e6;
  --muted: #a0a0a0;
  --accent: #cfcfcf;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 "DejaVu Sans", "Liberation Sans", sans-serif;
}

.wrap {
  max-width: 900px;
  margin: 0 auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 16px;
}

header h1 {
  font-size: 18px;
  font-weight: 600;
  margin: 0;
}

header .datetime {
  text-align: right;
}

.time {
  font-size: 22px;
}

.date {
  color: var(--muted);
  font-size: 13px;
}

/* panel layout */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 12px;
}

.panel.full {
  grid-column: 1 / -1;
}

.panel h2 {
  margin: 0 0 8px 0;
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  border-bottom: 1px solid var(--border);
  padding-bottom: 4px;
}

.content {
  font-size: 15px;
  line-height: 1.6;
}

button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--fg);
  font: inherit;
  padding: 6px 10px;
  cursor: pointer;
}

button:hover {
  border-color: var(--accent);
}

:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
</style>
</head>

<body>
<div class="wrap">

<header>
  <h1>steven's daily dashboard</h1>
  <div class="datetime">
    <div class="time" id="time"></div>
    <div class="date" id="date"></div>
  </div>
</header>

<div class="grid">

  <div class="panel">
    <h2>weather</h2>
    <div class="content" id="weather">
      calm and clear, mild temperature
    </div>
  </div>

  <div class="panel">
    <h2>on this day</h2>
    <div class="content" id="history">
      loading…
    </div>
  </div>

  <div class="panel full">
    <h2>reading</h2>
    <div class="content" id="quote">
      “the simple things are also the most extraordinary things.”
    </div>
  </div>

  <div class="panel full">
    <h2>message</h2>
    <div class="content">
      you are loved. take your time today.
    </div>
    <br>
    <button onclick="playMessage()">play message</button>
    <audio id="audio" src="message.mp3"></audio>
  </div>

</div>

</div>

<script>
/* time & date */
function updateTime() {
  const now = new Date();
  document.getElementById("time").textContent =
    now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  document.getElementById("date").textContent =
    now.toLocaleDateString(undefined, {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    });
}
updateTime();
setInterval(updateTime, 60000);

/* wikipedia */
function isCalm(text) {
  const bad = ["war","killed","attack","assassinated","bomb","battle"];
  return !bad.some(w => text.toLowerCase().includes(w));
}

async function loadWikipediaEvent() {
  const today = new Date();
  const key = "wiki-" + today.toDateString();
  const cached = localStorage.getItem(key);
  if (cached) {
    document.getElementById("history").textContent = cached;
    return;
  }

  const m = String(today.getMonth() + 1).padStart(2,"0");
  const d = String(today.getDate()).padStart(2,"0");

  try {
    const res = await fetch(
      `https://en.wikipedia.org/api/rest_v1/feed/onthisday/events/${m}/${d}`
    );
    const data = await res.json();
    const ev =
      (data.events || []).find(e => isCalm(e.text)) || data.events[0];

    const text = ev
      ? `in ${ev.year}, ${ev.text}`
      : "nothing notable recorded.";

    localStorage.setItem(key, text);
    document.getElementById("history").textContent = text;
  } catch {
    document.getElementById("history").textContent =
      "no data available today.";
  }
}
loadWikipediaEvent();

/* audio */
function playMessage() {
  document.getElementById("audio").play();
}
</script>

</body>
</html>
